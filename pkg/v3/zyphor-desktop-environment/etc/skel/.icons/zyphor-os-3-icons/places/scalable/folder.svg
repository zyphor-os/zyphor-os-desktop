<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="folderBack" x1="60" y1="90" x2="452" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b1d8f"/>
      <stop offset="0.45" stop-color="#1e3fae"/>
      <stop offset="1" stop-color="#0ea8d8"/>
    </linearGradient>
    <linearGradient id="folderFront" x1="40" y1="180" x2="470" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4c2fb8"/>
      <stop offset="0.5" stop-color="#1f7fe0"/>
      <stop offset="1" stop-color="#22c9f0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="zGrad" x1="180" y1="230" x2="340" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#dff7ff" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="none"/>

  <!-- ground shadow -->
  <ellipse cx="256" cy="452" rx="170" ry="18" fill="#123a7a" opacity="0.22" filter="url(#soft)"/>

  <!-- back tab/body of folder -->
  <path d="M 60,140
           C 60,120 76,104 96,104
           L 196,104
           C 210,104 222,110 231,120
           L 252,144
           C 261,154 273,160 287,160
           L 416,160
           C 436,160 452,176 452,196
           L 452,380
           C 452,400 436,416 416,416
           L 96,416
           C 76,416 60,400 60,380 Z"
        fill="url(#folderBack)"/>

  <!-- front flap of folder -->
  <path d="M 48,206
           C 48,190 61,177 77,177
           L 435,177
           C 451,177 464,190 464,206
           L 464,380
           C 464,400 448,416 428,416
           L 84,416
           C 64,416 48,400 48,380 Z"
        fill="url(#folderFront)"/>

  <!-- glossy highlight on front flap -->
  <path d="M 70,200 C 70,193 76,188 83,188 L 420,188"
        fill="none" stroke="url(#shine)" stroke-width="14" stroke-linecap="round" opacity="0.8"/>
</svg>