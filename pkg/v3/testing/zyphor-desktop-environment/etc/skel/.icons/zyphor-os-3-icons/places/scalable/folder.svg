<svg width="512" height="560" viewBox="0 0 512 560" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="folderBack" x1="60" y1="104" x2="452" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b1d8f"/>
      <stop offset="0.45" stop-color="#1e3fae"/>
      <stop offset="1" stop-color="#0ea8d8"/>
    </linearGradient>
    <linearGradient id="folderFront" x1="40" y1="192" x2="470" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4c2fb8"/>
      <stop offset="0.5" stop-color="#1f7fe0"/>
      <stop offset="1" stop-color="#22c9f0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="512" height="560" fill="none"/>

  <!-- ground shadow -->
  <ellipse cx="256" cy="523" rx="170" ry="20" fill="#123a7a" opacity="0.22" filter="url(#soft)"/>

  <!-- back tab/body of folder -->
  <path d="M 60,147.4
           C 60,123.3 76,104 96,104
           L 196,104
           C 210,104 222,111.23 231,123.3
           L 252,152.2
           C 261,164.25 273,171.5 287,171.5
           L 416,171.5
           C 436,171.5 452,190.76 452,214.9
           L 452,436.6
           C 452,460.7 436,480 416,480
           L 96,480
           C 76,480 60,460.7 60,436.6 Z"
        fill="url(#folderBack)"/>

  <!-- front flap of folder -->
  <path d="M 48,226.9
           C 48,207.63 61,191.97 77,191.97
           L 435,191.97
           C 451,191.97 464,207.63 464,226.9
           L 464,436.6
           C 464,460.7 448,480 428,480
           L 84,480
           C 64,480 48,460.7 48,436.6 Z"
        fill="url(#folderFront)"/>

  <!-- glossy highlight on front flap -->
  <path d="M 70,219.68 C 70,211.245 76,205.22 83,205.22 L 420,205.22"
        fill="none" stroke="url(#shine)" stroke-width="14" stroke-linecap="round" opacity="0.8"/>
</svg>